services:
  # 1. Backend API Service
  - type: web
    name: propertyhub-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false

  # 2. Frontend React Service
  - type: web
    name: propertyhub-frontend
    env: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: propertyhub-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
